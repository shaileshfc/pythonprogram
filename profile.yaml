version: 3
source:
  paths:
    - src
  exclude:
    - .github

pep8:
    max-line-length: 120
pyflakes:
    enabled: false
eradicate:
    enabled: false
vulture:
    enabled: false
bandit:
    enabled: false
mypy:
    enabled: false
    ignore_missing_imports: false
    strict: True
pycodestyle:
    enbaled: false
dodgy:
    enabled: false
pylint:
    enabled: false
profiles:
  default:
    inherit: base
    score:
      low: 3
      medium: 5
      high: 7
