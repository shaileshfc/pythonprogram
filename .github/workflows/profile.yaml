output-format: json

strictness: medium
test-warnings: true
doc-warnings: false

inherits:
  - my/other/profile.yml

ignore-paths:
  - docs

ignore-patterns:
  - (^|/)skip(this)?(/|$)

pycodestyle:
  disable:
    - W602
    - W603
  enable:
    - W601
  options:
    max-line-length: 79

mccabe:
  run: false
