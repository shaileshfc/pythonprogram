source:
  paths:
    - 
  exclude:
    - .github
    
output-format: text
strictness: high
test-warnings: true
doc-warnings: false

pep8:
  max-line-length: 120
pyflakes:
  enabled: false
eradicate:
  enabled: false
vulture:
  enabled: false
bandit:
  enabled: false
mypy:
  enabled: false
  ignore_missing_imports: false
  strict: True
pycodestyle:
  enbaled: false
dodgy:
  enabled: false
pylint:
  enabled: false
