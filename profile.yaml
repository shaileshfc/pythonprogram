output-format: text
strictness: high
test-warnings: true
doc-warnings: false
source:
  exclude:
    - .github
    - newfolder
pycodestyle:
  run: false
  disable:
    - W602
    - W603
  enable:
    - W601
  options:
    max-line-length: 79

bandit:
  run: true

pyflakes:
  run: false

vulture:
  run: true
