version: 3
source:
  paths:
    - src
  exclude:
    - .github
linters:
  pep8:
    max-line-length: 120
  pyflakes:
    enabled: false
  eradicate:
    enabled: true
  vulture:
    enabled: true
  bandit:
    enabled: true
  mypy:
    enabled: true
    ignore_missing_imports: false
    strict: True
  pycodestyle:
    enbaled: false
profiles:
  default:
    inherit: base
    score:
      low: 3
      medium: 5
      high: 7
