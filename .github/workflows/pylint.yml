name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Prospector
      run: |
        pip install dodgy mccabe mypy  pycodestyle pydocstyle pylint
        python -m pip install prospector[with_bandit]
    - name: Run Prospector
      run: |
        prospector --profile profile.yaml
          
